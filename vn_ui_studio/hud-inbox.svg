<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 300" width="512" height="300" role="img" aria-labelledby="title desc"><title>Message &amp; event notification tray</title><desc>Original VN Studio concept. Unread / read / muted. All values are visual samples.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".25"/></filter></defs><g font-family="Arial,sans-serif" stroke-linejoin="round"><text x="24" y="22" font-size="10" fill="#9babaf" font-family="monospace" letter-spacing="1.8">11 / INBOX &amp; UNREAD STATES</text><g transform="translate(27 38) rotate(-4 100 80)"><rect x="0" y="0" width="155" height="115" rx="4" fill="#293840" stroke="#9babaf" stroke-opacity=".6"/><path d="M0 0l77 65L155 0" fill="none" stroke="#9babaf" /><path d="M0 115l58-62M155 115l-58-62" fill="none" stroke="#9babaf" /></g><g transform="translate(52 66) rotate(3 100 80)"><rect x="0" y="0" width="155" height="115" rx="4" fill="#131e27" stroke="#d5b56e" stroke-opacity=".6"/><path d="M0 0l77 65L155 0" fill="none" stroke="#d5b56e" /><path d="M77 49 93 65 77 81 61 65Z" fill="#d5b56e" stroke="#d5b56e" /></g><circle cx="195" cy="76" r="20" fill="#d48c8b" stroke="#d48c8b" /><text x="195" y="82" font-size="18" fill="#131e27" text-anchor="middle" font-family="monospace">2</text><text x="239" y="75" font-size="10" fill="#d5b56e" font-family="monospace" letter-spacing="1.8">NOTIFICATION TRAY</text><text x="239" y="108" font-size="25" fill="#f0e4c5" font-family="Georgia,serif">New messages</text><text x="239" y="138" font-size="12" fill="#9babaf" >Open when you are ready.</text><rect x="239" y="158" width="225" height="37" rx="3" fill="#1d2c36" stroke="#d5b56e" stroke-opacity=".6"/><g transform="translate(262 176)" stroke="#d5b56e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-12-8h24v16h-24zM-12-8 0 1 12-8"/></g><text x="288" y="181" font-size="13" fill